name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile (app + connettore + script)
        run: python -m compileall app mcp-connector scripts

      - name: Run tests
        run: python -m pytest -q

      # B3 · La console è UNA: i tre file devono combaciare col manifesto. Un
      # file toccato senza rigenerarlo (o senza copiarlo nell'altro repo) rende
      # rossa la CI qui, invece di divergere in silenzio per settimane.
      - name: Parità della console (manifesto)
        run: python3 scripts/console_parita.py

      # C1 · Il guardiano NON dorme più: «_rec is not defined» è passato per
      # questa CI ed è arrivato in produzione lasciando la console morta.
      # Da qui in poi la console si APRE davvero a ogni push: eccezioni di
      # pagina, navigazione morta, orb che non disegna, modale che si chiude
      # durante la risposta → CI rossa.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium (guardiano console)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: La console si apre DAVVERO (headless)
        run: node scripts/test_console_headless.js
